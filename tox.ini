[tox]
envlist = py{36,37,38,39,310,311,312,313,314}, py38-mypy, py311-fam, pylint

[testenv]
deps =
    -rrequirements.txt
    -rrequirements-test.txt
commands =
    py.test -n auto --cov=apypie --cov-report term --cov-report xml --cov-report html {posargs}

[testenv:py38-mypy]
deps =
    mypy
    types-requests
commands =
    mypy -p apypie

[testenv:py311-fam]
deps =
    -rrequirements.txt
commands =
    {toxinidir}/tests/foreman-ansible-modules.sh
allowlist_externals =
    {toxinidir}/tests/foreman-ansible-modules.sh

[testenv:pylint]
deps =
    pylint
commands =
    pylint --output-format text,github apypie
allowlist_externals = pylint

[pytest]
flake8-max-line-length = 500

[gh-actions]
python =
  3.6: py36
  3.7: py37
  3.8: py38
  3.9: py39
  3.10: py310
  3.11: py311
  3.12: py312
  3.13: py313
  3.14: py314
problem_matcher = False
